# Single-VPS stack (sized for 4 vCPU / 8 GB RAM), used by deploy/vps.sh.
#
# Production layout is WEB_ON_VPS=1: the landing page, the app and the API all
# run here behind one Caddy. Without it only the API is served and the frontend
# is expected on Vercel (cross-origin). Images are built on the server by
# vps.sh; the running stack idles well under 2 GB.
#
#   caddy      HTTPS for DOMAIN; /api/* and /health/* to the backend, nothing else
#   migrate    alembic upgrade head, once per start
#   backend    FastAPI
#   worker     outbox worker (notifications, matter-agent turns)
#   retrieval  statute and case-law search; internal, plus 127.0.0.1:8001 for an SSH tunnel
#   db         bundled Postgres 16 (profile `localdb`), when DATABASE_URL points at it
#
# With WEB_ON_VPS=1 (profile `web`) the frontend and the landing page run here
# too and Caddy serves both, so nothing is hosted on Vercel:
#
#   frontend   Next.js standalone server, same origin as the API (DOMAIN)
#   landing    marketing site + pilot-request intake (LANDING_DOMAIN)
#
# docker-compose.yml is the single-origin variant for prebuilt images and Neon.

name: draftly

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
  environment:
    ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT}
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?set DATABASE_URL_DIRECT}
    # The app's own origin (or the Vercel origin): the only browser origin
    # allowed to call this API.
    ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
    CLERK_ISSUER: ${CLERK_ISSUER:?set CLERK_ISSUER}
    CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
    CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
    CLERK_AUTHORIZED_PARTY: ${CLERK_AUTHORIZED_PARTY:?set CLERK_AUTHORIZED_PARTY}
    USE_STUB_IDENTITY: "false"
    CLERK_LEEWAY_SECONDS: ${CLERK_LEEWAY_SECONDS:-30}
    # Draftly staff who may grant trials (comma-separated user ids). Empty = nobody.
    PLATFORM_ADMIN_USER_IDS: ${PLATFORM_ADMIN_USER_IDS:-}
    # false = every account gets every feature and no quota applies, plan or not.
    # Break-glass only — see SIGNUP_TRIAL_DAYS for the intended way in.
    ENFORCE_PLAN_LIMITS: ${ENFORCE_PLAN_LIMITS:-true}
    # Trial length (days) granted automatically to an active account with no
    # plan yet, on first sign-in. 0 turns auto-granting off.
    SIGNUP_TRIAL_DAYS: ${SIGNUP_TRIAL_DAYS:-30}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    RESEARCH_MODEL: ${RESEARCH_MODEL:-gemini-2.5-flash}
    GEMINI_CLASSIFY_MODEL: ${GEMINI_CLASSIFY_MODEL:-gemini-2.5-flash-lite}
    GEMINI_EXTRACT_MODEL: ${GEMINI_EXTRACT_MODEL:-gemini-2.5-flash-lite}
    EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-stub}
    DEMO_RELAXED_GATES: ${DEMO_RELAXED_GATES:-false}
    PROVIDER_DATA_APPROVAL: ${PROVIDER_DATA_APPROVAL:-false}
    MATTER_AGENT_ENABLED: ${MATTER_AGENT_ENABLED:-true}
    MATTER_AGENT_MODEL: ${MATTER_AGENT_MODEL:-gemini-3.5-flash-lite}
    SOURCE_FILE_STORAGE: filesystem
    PARTY_IDENTIFIER_KEY: ${PARTY_IDENTIFIER_KEY:?set PARTY_IDENTIFIER_KEY}
    PARTY_BLIND_INDEX_KEY: ${PARTY_BLIND_INDEX_KEY:?set PARTY_BLIND_INDEX_KEY}
    API_CURSOR_SIGNING_KEY: ${API_CURSOR_SIGNING_KEY:?set API_CURSOR_SIGNING_KEY}
    # research/infrastructure/retrieval/http_adapter.py: search goes to the
    # retrieval container's own, independently-updated index instead of the
    # corpus bundled into this image at build time.
    RETRIEVAL_BASE_URL: http://retrieval:8000
  depends_on: &after-db
    db:
      condition: service_healthy
      required: false
  logging: *logging

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      # Only read by Caddyfile.full.
      LANDING_DOMAIN: ${LANDING_DOMAIN:-landing.invalid}
    volumes:
      - ${CADDYFILE:-./Caddyfile.api}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    mem_limit: 128m
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    profiles: ["web"]
    restart: unless-stopped
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NODE_OPTIONS: --max-old-space-size=768
    expose:
      - "3000"
    mem_limit: 1g
    logging: *logging

  landing:
    image: ${LANDING_IMAGE:-draftly-landing:vps}
    profiles: ["web"]
    restart: unless-stopped
    environment:
      # /app on the landing page redirects to the application.
      DRAFTLY_APP_URL: https://${DOMAIN}/
    volumes:
      - pilot-requests:/data/pilot-requests
    expose:
      - "4173"
    read_only: true
    mem_limit: 256m
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    mem_limit: 512m

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      <<: *after-db
      migrate:
        condition: service_completed_successfully
    volumes:
      - source-files:/app/.data
    expose:
      - "8000"
    mem_limit: 1g

  worker:
    <<: *backend
    command: ["python", "-m", "src.workers.runner"]
    restart: unless-stopped
    depends_on:
      <<: *after-db
      migrate:
        condition: service_completed_successfully
    # The worker serves no HTTP, so the image's /health/live check does not
    # apply. This only says the runner process is alive, which is what
    # `compose up --wait` needs; a crashed runner restarts the container anyway.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 512m

  # No auth, and /answer spends Gemini credits: never on the internet. The
  # loopback port is for an SSH tunnel from your machine only.
  retrieval:
    image: ${RETRIEVAL_IMAGE:?set RETRIEVAL_IMAGE}
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    logging: *logging

  db:
    # Same major version as the Neon database this replaced (18), so a dump moves
    # across unchanged. Not published: only the backend, worker and migrate reach
    # it, over the compose network. Data lives in the pg-data volume.
    image: postgres:18-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: draftly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: draftly
    # Sized for the 8 GB host shared with the other services.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U draftly -d draftly"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/, so the
      # volume must be mounted one level up (not at .../data).
      - pg-data:/var/lib/postgresql
    expose:
      - "5432"
    mem_limit: 2g
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  source-files:
  pg-data:
  pilot-requests:
