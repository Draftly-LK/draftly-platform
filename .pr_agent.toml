# PR-Agent configuration.
#
# This file is the single home for review model and behaviour settings. The
# workflow checks out the default branch before running PR-Agent, so the copy
# used at review time is the merged one, not the pull request's.
#
# It is not a security control on its own. See docs/CODE_REVIEWER.md,
# "What is and is not protected".

[config]
model = "gpt-5.4-mini"
reasoning_effort = "medium"
fallback_models = []
repo_context_files = ["CODE_REVIEW_CONTEXT.md"]
repo_context_from_default_branch = true
# Confirm this against the model's real context window. Set too low, PR-Agent
# compresses a large diff and drops files with no signal in the output, so the
# review looks complete when it is not. The skill requires the reviewer to
# disclose truncation; this value should make that rare.
max_model_tokens = 64000

[skills]
enabled = true
max_skills_tokens = 5000

[pr_reviewer]
require_score_review = false
require_tests_review = true
require_security_review = true
# Disabled deliberately. Both emit their own sections, which bypass the skill's
# finding threshold and produce exactly the vague suggestions it forbids.
# can_be_split fires on nearly every substantive Draftly change, and there is no
# documented ticket convention for ticket_analysis to read.
require_can_be_split_review = false
require_ticket_analysis_review = false
num_max_findings = 5
extra_instructions = """
Apply the loaded draftly-code-review skill. Return only actionable findings.
"""
