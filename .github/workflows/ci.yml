name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Third-party actions should be pinned to immutable commit SHAs.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      # The root script is the single list of frontend gates: typecheck, lint,
      # vitest, build, markdown. Calling it here keeps CI from drifting again.
      - run: pnpm check

  # Turns itself on when the backend project lands. Until backend/pyproject.toml
  # exists this job succeeds without running anything.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres for the tests that SQLite cannot stand in for: the outbox,
    # JSON columns, unique constraints and transaction semantics.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: draftly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend project
        id: probe
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pyproject.toml yet; backend gates are not applicable."
          fi

      - name: Set up uv
        if: steps.probe.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Backend gates
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        env:
          # Points the real-database suite at the service above. REQUIRE turns
          # an unreachable database into a failure instead of a quiet skip.
          DRAFTLY_E2E_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/draftly_test
          DRAFTLY_E2E_REQUIRE_DATABASE: "1"
        run: |
          set -euo pipefail
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          # Every suite under testpaths, including the co-located module tests.
          # Only paid live-provider probes are left out.
          uv run pytest -m "not live" --cov --cov-report=term:skip-covered
