name: CI

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml runs this same workflow first on every push to prod.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Third-party actions are pinned to immutable commit SHAs (see
      # docs/CODE_REVIEWER.md maintenance notes); bump them deliberately.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm check:markdown

  # Turns itself on when the backend project lands. Until backend/pyproject.toml
  # exists this job succeeds without running anything, so nobody has to remember
  # to wire the backend gates that CODE_REVIEW_CONTEXT.md already promises.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect backend project
        id: probe
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pyproject.toml yet; backend gates are not applicable."
          fi

      - name: Set up uv
        if: steps.probe.outputs.present == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Backend gates
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest tests/unit tests/contract tests/conformance

      # The conformance suite is parameterised over backend/contracts/services.yaml
      # (backend/docs/service-definition-of-done.md §4, §9). This check keeps the
      # registry parseable and in step with the service catalogue even before any
      # Python exists.
      - name: Validate the service registry
        if: hashFiles('backend/contracts/services.yaml') != ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml

          # Paths inside the registry are relative to backend/, which is where a
          # developer runs pytest from.
          root = pathlib.Path("backend")
          reg = yaml.safe_load((root / "contracts/services.yaml").read_text())
          published, consumed, problems = {}, {}, []

          for svc in reg:
              for key in ("name", "doc", "level", "phase"):
                  if key not in svc:
                      problems.append(f"{svc.get('name', '?')}: missing '{key}'")
              if not (root / svc["doc"]).is_file():
                  problems.append(f"{svc['name']}: doc not found at {svc['doc']}")
              for event in svc.get("publishes") or []:
                  published.setdefault(event, []).append(svc["name"])
              for event in svc.get("consumes") or []:
                  consumed.setdefault(event, []).append(svc["name"])

          for event, consumers in sorted(consumed.items()):
              if event not in published:
                  problems.append(
                      f"{event}: consumed by {', '.join(consumers)} with no publisher"
                  )
          for event, publishers in sorted(published.items()):
              if len(publishers) > 1:
                  problems.append(f"{event}: published by {', '.join(publishers)}")

          registry = (root / "docs/events.md").read_text()
          for event in sorted(set(published) | set(consumed)):
              if f"`{event}`" not in registry:
                  problems.append(f"{event}: absent from backend/docs/events.md")

          if problems:
              print("Service registry problems:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)
          print(f"Registry OK: {len(reg)} services, {len(published)} events.")
          PY

  # The landing page is plain Node with no build step; its intake route stores
  # email addresses, so its tests run on every change.
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
      - run: node --test landing-page/pilot-api.test.mjs

  # Everything deploy/vps.sh will ship must at least build. The retrieval image
  # is left out: it needs the private research repository.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, landing-page]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # Throwaway values: NEXT_PUBLIC_* are inlined at build time and this
          # image is never run or pushed. The key body is base64 of "ci.clerk.accounts.dev$".
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://ci.invalid
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA==

  # Catches a broken compose file, Caddyfile or deploy script before prod does.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck deploy scripts
        run: shellcheck -S error deploy/*.sh
      - name: Validate the compose stack
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ci.env" <<'EOF'
          DOMAIN=app.example.com
          LANDING_DOMAIN=example.com
          FRONTEND_ORIGIN=https://app.example.com
          ENVIRONMENT=local
          DATABASE_URL=postgresql+psycopg://u:p@db.example.com/d
          DATABASE_URL_DIRECT=postgresql+psycopg://u:p@db.example.com/d
          CLERK_ISSUER=https://ci.clerk.accounts.dev
          CLERK_SECRET_KEY=sk_test_ci
          CLERK_AUTHORIZED_PARTY=https://app.example.com
          PARTY_IDENTIFIER_KEY=ci
          PARTY_BLIND_INDEX_KEY=ci
          API_CURSOR_SIGNING_KEY=ci
          BACKEND_IMAGE=draftly-backend:ci
          FRONTEND_IMAGE=draftly-frontend:ci
          RETRIEVAL_IMAGE=draftly-retrieval:ci
          LANDING_IMAGE=draftly-landing:ci
          EOF
          docker compose --project-name draftly --env-file "$RUNNER_TEMP/ci.env" \
            -f deploy/docker-compose.vps.yml --profile web config --quiet
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e DOMAIN=app.example.com -e LANDING_DOMAIN=example.com \
            -v "$PWD/deploy/Caddyfile.full:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
