# Alembic configuration file — used by `uv run alembic` commands.
#
# Uses DATABASE_URL_DIRECT (un-pooled) for migrations.
# The application runtime uses DATABASE_URL (pooled via PgBouncer).
# See infrastructure.md §Database for why these must be separate.

[alembic]
# Relative to the backend/ directory when running `uv run alembic`
script_location = migrations
file_template = %%(slug)s_%%(rev)s
prepend_sys_path = .
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
