# Service registry — the machine-readable half of docs/services/README.md.
#
# tests/conformance/ is parameterised over this file, so registering a service
# here subjects it to every cross-service test in
# docs/service-definition-of-done.md §4. docs/services/README.md §2 is generated
# from it; test_registry_matches_readme fails the build if the two drift.
#
# level: L0 designed | L1 contracted | L2 conformant | L3 functional | L4 accepted
# exemptions: explicit, reviewed opt-outs from a conformance test. Visible on
#             purpose — a silent exemption is how a gate quietly stops gating.

- name: auth_service
  doc: docs/services/auth-service.md
  level: L0
  phase: 2
  matter_scoped: false
  routes_prefix: /api/v1
  capabilities: [matter.membership.assign, user.role.set]
  publishes: [user.provisioned, user.activated, user.suspended, user.role-changed,
              user.invited, organisation.membership-changed, matter.membership-changed]
  consumes: []
  metered: []
  owns_tables: [users, user_identities, organisations, organisation_memberships,
                matter_memberships, invitations, compliance_allowlist]
  jobs: []
  exemptions:
    - test: test_tenancy.test_every_table_has_organisation_id
      tables: [users, user_identities]
      reason: A user exists before organisation selection; tenancy is on the membership rows.

